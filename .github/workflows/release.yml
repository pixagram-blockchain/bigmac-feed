# Publishes the image to Docker Hub as pixarex/bigmac-feed:<version> and pixarex/bigmac-feed:latest.
#
# Runs when a version tag such as v1.4.0 is pushed, or from the Actions tab ("Run workflow")
# with a version, in which case the image is built from the branch the run is started on.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  the Docker Hub account, pixarex
#   DOCKERHUB_TOKEN     a Docker Hub access token of that account with Read & Write permission
name: Release image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, such as v1.4.0"
        required: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v1.4.0, got: $VERSION"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # linux/amd64, like the images published so far.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            pixarex/bigmac-feed:${{ env.VERSION }}
            pixarex/bigmac-feed:latest
